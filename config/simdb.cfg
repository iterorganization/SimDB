[flask]
flask_env = development
debug = True
testing = True
secret_key = CHANGE_ME

[cache]
type = RedisCache
redis_url = redis://redis:6379/0
default_timeout = 300

[authentication]
type=none
# See docs/how-to/operate-server/configure-authentication.md
# For a server behind an authenticating proxy or firewall, use:
#type=Firewall
#firewall_user = X-Forwarded-User
#firewall_email = X-Forwarded-Email

[server]
upload_folder = /data/simdb/simulations
port = 5000
ssl_enabled = False
admin_password = CHANGE_ME
imas_remote_host = localhost
imas_remote_substitution = True

[database]
type = postgres
host = postgres
port = 5432
username = simdb
password = simdb
database = simdb

[validation]
path = ./validation/iter_scenarios_validation.yaml
auto_validate = True
error_on_fail = True

[celery]
broker_url = redis://redis:6379/0
result_backend = redis://redis:6379/0

[partition]
data = /data/simdb/partition
