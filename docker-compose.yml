services:
  migrations:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
    image: ${SIMDB_IMAGE:-simdb-server}:${SIMDB_TAG:-local}
    volumes:
      - ./config:/app/config:ro
    environment:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
      DATABASE_URL: postgresql+psycopg2://simdb:simdb@postgres:5432/simdb
    depends_on:
      postgres:
        condition: service_healthy
    command: uv run alembic upgrade head
    restart: "no"

  web:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
    image: ${SIMDB_IMAGE:-simdb-server}:${SIMDB_TAG:-local}
    environment:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
      # Set APP_DATA_DIR if it is required, to check it is writable
      APP_DATA_DIR: /data/simdb/simulations
      IMAS_LOCAL_HOSTS: localhost
      GUNICORN_BIND: ${GUNICORN_BIND:-0.0.0.0:5000}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_WORKER_CLASS: ${GUNICORN_WORKER_CLASS:-gthread}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-120}
      GUNICORN_LOG_LEVEL: ${GUNICORN_LOG_LEVEL:-info}
    ports:
      - "5000:5000"
    volumes:
      - ./validation:/app/validation:ro
      - ./config:/app/config:ro
      - ./tmp/partition_data:/data/simdb/partition:ro
      - ./tmp/http:/data/simdb/http
      - ${SIMDB_UPLOAD_DIR:-./upload_folder}:/data/simdb/simulations
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    profiles: [with_workers]
    # docker compose --profile with_workers enables this service
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
    image: ${SIMDB_IMAGE:-simdb-server}:${SIMDB_TAG:-local}
    environment:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
      # Set APP_DATA_DIR if it is required, to check it is writable
      APP_DATA_DIR: /data/simdb/simulations
    command: uv run simdb_worker
    volumes:
      - ./config:/app/config:ro
      - ./tmp/partition_data:/data/simdb/partition:ro
      - ./tmp/http:/data/simdb/http
      - ${SIMDB_UPLOAD_DIR:-./upload_folder}:/data/simdb/simulations
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  beat:
    profiles: [with_workers]
    # docker compose --profile with_workers enables this service
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-0.0.0}
    image: ${SIMDB_IMAGE:-simdb-server}:${SIMDB_TAG:-local}
    environment:
      APP_UID: ${APP_UID:-1000}
      APP_GID: ${APP_GID:-1000}
    # The non-privileged user needs write permission to the schedule-file
    command: uv run simdb_beat --schedule-file=/tmp/celerybeat-schedule
    volumes:
      - ./config:/app/config:ro
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    restart: unless-stopped

  redis:
    image: redis:8.6.6-alpine3.23@sha256:23a604374ece8069b34131faac7a1f05ae73c64280e46af1de844f29af2846d4
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: postgres:16.15-alpine3.23@sha256:621a761097839bdb50207afd6b87a72f38e2d718dd46c3d744828d8917c4f1e0
    environment:
      - POSTGRES_USER=simdb
      - POSTGRES_PASSWORD=simdb
      - POSTGRES_DB=simdb
      - POSTGRES_INITDB_ARGS=--locale-provider=icu --icu-locale=en_US.utf8  # workaround for alpine not having locale
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U simdb -d simdb"]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 30s
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data:
