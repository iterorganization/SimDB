name: Docker Image build and publish

# Triggers and action summary:
# pull-request -> ignored in this GHA, linting and testing done elsewhere.
# push develop -> build and push image tagged :<version> and :develop.
# push main    -> build and push image tagged :latest.
# push tag     -> build and push image tagged :<version>.

env:
  CACHE_FROM: type=gha,scope=simdb-server
  CACHE_TO: type=gha,mode=max,scope=simdb-server
  SETUPTOOLS_SCM_OVERRIDES_FOR_IMAS_SIMDB: '{local_scheme = "no-local-version-strict"}'

on:
  push:
    branches: [ "develop", "main" ]
    tags: [ "*" ]

# Serialize runs per ref, so that two merges in quick succession can't race to
# move the "develop" image tag backward. The running job is never cancelled;
# GitHub does however keep only the newest *pending* run per group, so a third
# queued run supersedes the second.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-tags: true
        fetch-depth: 0

    - name: Get version
      id: version
      run: |
        # The same version derivation script is run by ./Makefile:
        echo "pep440=$(sh docker/version.sh pep440)" >> "$GITHUB_OUTPUT"
        echo "dockertag=$(sh docker/version.sh dockertag)" >> "$GITHUB_OUTPUT"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Build build image
      uses: docker/build-push-action@v7
      with:
        target: build
        load: true
        tags: simdb-server:build
        build-args: APP_VERSION=${{ steps.version.outputs.pep440 }}
        cache-from: ${{ env.CACHE_FROM }}
        cache-to: ${{ env.CACHE_TO }}

    - name: Build service image
      uses: docker/build-push-action@v7
      with:
        target: service
        load: true
        tags: simdb-server:service
        build-args: APP_VERSION=${{ steps.version.outputs.pep440 }}
        cache-from: ${{ env.CACHE_FROM }}
        cache-to: ${{ env.CACHE_TO }}

    - name: Lowercase repo-owner
      id: repo_owner
      run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ steps.repo_owner.outputs.value }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # Versioned tag: develop pushes and any tag push. main is excluded -- it
    # follows develop and only publishes :latest.
    - name: Tag and push service image with version tag
      if: ${{ github.ref_type == 'tag' || github.ref_name == 'develop' }}
      run: |
        docker tag \
          simdb-server:service \
          ghcr.io/${{ steps.repo_owner.outputs.value }}/simdb-server:${{ steps.version.outputs.dockertag }}
        docker push ghcr.io/${{ steps.repo_owner.outputs.value }}/simdb-server:${{ steps.version.outputs.dockertag }}

    # Run on develop pushes only
    - name: Tag image :develop and publish
      if: ${{ github.ref_type == 'branch' && github.ref_name == 'develop' }}
      run: |
        docker tag \
          simdb-server:service \
          ghcr.io/${{ steps.repo_owner.outputs.value }}/simdb-server:develop
        docker push ghcr.io/${{ steps.repo_owner.outputs.value }}/simdb-server:develop

    # Run on main pushes only
    - name: Tag image :latest and publish
      if: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
      run: |
        docker tag \
          simdb-server:service \
          ghcr.io/${{ steps.repo_owner.outputs.value }}/simdb-server:latest
        docker push ghcr.io/${{ steps.repo_owner.outputs.value }}/simdb-server:latest
